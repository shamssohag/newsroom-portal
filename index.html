<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsroom Management Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div id="loginSection" class="max-w-md mx-auto my-20 bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">Newsroom Portal Login</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Email:</label>
                <input type="email" id="loginEmail" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password:</label>
                <input type="password" id="loginPassword" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <button type="submit" id="loginBtn" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition duration-200 font-semibold">
                    Login
                </button>
            </div>
        </form>
        <div id="loginError" class="mt-4 text-center text-red-600 font-medium"></div>
    </div>

    <div id="dashboardSection" class="hidden max-w-4xl mx-auto my-10 bg-white p-8 rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h2 id="welcomeText" class="text-2xl font-bold text-gray-800">Welcome</h2>
                <p id="userRoleText" class="text-sm text-indigo-600 font-semibold"></p>
            </div>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 text-sm font-medium">Logout</button>
        </div>

        <div id="roleContent">
            </div>
    </div>

    <script>
        // আপনার নতুন ডিপ্লয়কৃত Web App URL এখানে সেট করা আছে
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyORP56YyvV5WV-V3HH9GXWx1bt9SXUlyCTw7fb6hxEEmMQ8MIJ45kLovbdhpSNujuP6w/exec";
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            var email = document.getElementById("loginEmail").value;
            var password = document.getElementById("loginPassword").value;
            var loginBtn = document.getElementById("loginBtn");
            var errorDiv = document.getElementById("loginError");

            loginBtn.disabled = true;
            loginBtn.innerText = "Logging in...";
            errorDiv.innerText = "";

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "login", email: email, password: password })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    localStorage.setItem("user", JSON.stringify(data));
                    loadDashboard(data);
                } else {
                    errorDiv.innerText = data.message;
                    loginBtn.disabled = false;
                    loginBtn.innerText = "Login";
                }
            })
            .catch(err => {
                errorDiv.innerText = "Connection Error: " + err;
                loginBtn.disabled = false;
                loginBtn.innerText = "Login";
            });
        });

        function loadDashboard(user) {
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("dashboardSection").classList.remove("hidden");
            
            document.getElementById("welcomeText").innerText = "Hello, " + user.name;
            document.getElementById("userRoleText").innerText = "Role: " + user.role;

            var contentDiv = document.getElementById("roleContent");
            contentDiv.innerHTML = "";

            if (user.role === "Admin") {
                contentDiv.innerHTML = `
                    <div class="bg-indigo-50 p-6 rounded-lg border border-indigo-200">
                        <h3 class="text-xl font-bold text-indigo-800 mb-4">Admin Control Panel</h3>
                        <p class="text-gray-600 mb-4">Manage system users, reporters, editors, and access control.</p>
                        <div class="bg-white p-4 rounded shadow">
                            <h4 class="font-bold mb-2 text-gray-700">Add New User / Staff</h4>
                            <input type="text" id="newName" placeholder="Full Name" class="block w-full mb-2 px-3 py-2 border rounded">
                            <input type="email" id="newEmail" placeholder="Email Address" class="block w-full mb-2 px-3 py-2 border rounded">
                            <input type="password" id="newPassword" placeholder="Password" class="block w-full mb-2 px-3 py-2 border rounded">
                            <select id="newRole" class="block w-full mb-2 px-3 py-2 border rounded">
                                <option value="Reporter">Reporter</option>
                                <option value="Editor">Editor</option>
                                <option value="Desk In-charge">Desk In-charge</option>
                                <option value="Admin">Admin</option>
                            </select>
                            <button onclick="addNewUser()" class="bg-green-600 text-white px-4 py-2 rounded font-semibold hover:bg-green-700">Create User</button>
                        </div>
                    </div>
                `;
            } else if (user.role === "Editor" || user.role === "Desk In-charge") {
                contentDiv.innerHTML = `
                    <div class="bg-blue-50 p-6 rounded-lg border border-blue-200">
                        <h3 class="text-xl font-bold text-blue-800 mb-2">Review Dashboard (${user.role})</h3>
                        <p class="text-gray-600">Review scripts submitted by reporters and update editorial status.</p>
                    </div>
                `;
            } else {
                contentDiv.innerHTML = `
                    <div class="bg-gray-50 p-6 rounded-lg border">
                        <h3 class="text-xl font-bold text-gray-800 mb-4">Reporter Script Submission Form</h3>
                        <p class="text-gray-500">[Your news submission form goes here]</p>
                    </div>
                `;
            }
        }

        function addNewUser() {
            var name = document.getElementById("newName").value;
            var email = document.getElementById("newEmail").value;
            var password = document.getElementById("newPassword").value;
            var role = document.getElementById("newRole").value;

            if(!name || !email || !password) {
                alert("Please fill all fields!");
                return;
            }

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "addUser", newName: name, newEmail: email, newPassword: password, newRole: role })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                document.getElementById("newName").value = "";
                document.getElementById("newEmail").value = "";
                document.getElementById("newPassword").value = "";
            })
            .catch(err => alert("Error: " + err));
        }

        function logout() {
            localStorage.removeItem("user");
            location.reload();
        }

        window.onload = function() {
            var savedUser = localStorage.getItem("user");
            if(savedUser) {
                loadDashboard(JSON.parse(savedUser));
            }
        }
    </script>
</body>
</html>
